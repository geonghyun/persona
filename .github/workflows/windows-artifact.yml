name: Build Windows listener artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run native:build
      - run: npm run native:test

      - uses: actions/upload-artifact@v4
        with:
          name: persona-windows-listener
          path: native/bin/win32/persona-audio-listener.exe
          if-no-files-found: error
